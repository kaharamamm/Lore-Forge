appId: dev.kaharamamm.loreforge
productName: Lore-Forge
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  # Only the sample world Camelamamm ships; the other folders in worlds/ are private.
  - from: ../../worlds/camelamamm
    to: worlds/camelamamm
  - from: ../../node_modules/dejavu-fonts-ttf/ttf
    to: fonts
    filter:
      - DejaVuSans.ttf
      - DejaVuSans-Bold.ttf
      - DejaVuSans-Oblique.ttf
      - DejaVuSerif.ttf
      - DejaVuSerif-Bold.ttf
      - DejaVuSerif-Italic.ttf
      - DejaVuSansMono.ttf
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
linux:
  target: AppImage
  category: Office
  icon: build/icons
  desktop:
    entry:
      Name: Lore-Forge
      Comment: Write and check the lore of your worlds
      StartupWMClass: lore-forge
