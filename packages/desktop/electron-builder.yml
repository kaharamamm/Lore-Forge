appId: dev.kaharamamm.loreforge
productName: Lore-Forge
directories:
  output: release
  buildResources: build
# Versioned file names, e.g. Lore-Forge-1.1.0-win-x64.exe: the self-updater's latest*.yml files point at these.
# The release workflow also attaches copies under stable names (Lore-Forge-amd64.deb, ...) for the download links.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Where the self-updater looks for new versions (the release workflow uploads the files itself: --publish never).
publish:
  provider: github
  owner: kaharamamm
  repo: Lore-Forge
  releaseType: release
files:
  - dist/**/*
  - package.json
# .loreforge book files (Share this book) open in Lore-Forge: double-click, Open with, the file's icon.
fileAssociations:
  - ext: loreforge
    name: Lore-Forge book
    description: Lore-Forge book
    mimeType: application/x-loreforge
    role: Editor
extraResources:
  # Only the sample world Camelamamm ships; the other folders in worlds/ are private.
  - from: ../../worlds/camelamamm
    to: worlds/camelamamm
  - from: ../../node_modules/dejavu-fonts-ttf/ttf
    to: fonts
    filter:
      - DejaVuSans.ttf
      - DejaVuSans-Bold.ttf
      - DejaVuSans-Oblique.ttf
      - DejaVuSerif.ttf
      - DejaVuSerif-Bold.ttf
      - DejaVuSerif-Italic.ttf
      - DejaVuSansMono.ttf
  # The DejaVu licence must travel with the font files.
  - from: ../../node_modules/dejavu-fonts-ttf/LICENSE
    to: fonts/DejaVu-LICENSE.txt
  # The lore command-line tool: small wrappers that run dist/cli.cjs with the app's own Electron in Node mode.
  - from: build/bin
    to: bin
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # The zip is only there for latest-mac.yml (update checks); unsigned apps cannot install updates themselves.
  target:
    - dmg
    - zip
  # No Apple Developer certificate: sign ad hoc, so the app runs on Apple Silicon. Gatekeeper still asks once.
  identity: "-"
  # Ad-hoc signing with the hardened runtime would reject Electron's own pre-signed frameworks at launch.
  hardenedRuntime: false
deb:
  # Same package name as 1.0.0, so installing a newer .deb upgrades it in place. The scripts are electron-builder's
  # own plus a /usr/bin/lore link.
  packageName: lore-forge
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
linux:
  # .deb for Debian and Ubuntu: its installer adds an AppArmor profile on Ubuntu 24+ (or a setuid chrome-sandbox on
  # systems without user namespaces), so the app keeps Chromium's sandbox. AppImage for every other distribution.
  target:
    - AppImage
    - deb
  maintainer: Ahmet Kadir Zengin
  synopsis: Write the worlds, lore and characters of your games
  description: A local-first app for writing game worlds, lore, characters and stories, with a consistency checker, a World Codex PDF and a print-ready Story Book.
  # The package name (@lore-forge/desktop) is not a valid file name.
  executableName: lore-forge
  category: Office
  icon: build/icons
  desktop:
    entry:
      Name: Lore-Forge
      Comment: Write and check the lore of your worlds
      StartupWMClass: lore-forge
