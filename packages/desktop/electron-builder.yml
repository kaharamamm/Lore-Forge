appId: dev.kaharamamm.loreforge
productName: Lore-Forge
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../../examples
    to: examples
  - from: ../../node_modules/dejavu-fonts-ttf/ttf
    to: fonts
    filter:
      - DejaVuSans.ttf
      - DejaVuSans-Bold.ttf
      - DejaVuSans-Oblique.ttf
      - DejaVuSerif.ttf
      - DejaVuSerif-Bold.ttf
      - DejaVuSerif-Italic.ttf
      - DejaVuSansMono.ttf
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Office
