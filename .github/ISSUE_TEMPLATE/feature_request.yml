name: Feature request
description: An idea for Lore-Forge.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Other tools that do this well, workarounds, examples.
