# Build and publish a Lore-Forge release: Actions > Release > Run workflow.
# The version is the newest vX.Y.Z tag plus the chosen bump, or the exact version given. It goes to electron-builder
# on the command line; package.json is never bumped by hand. If that tag already exists, nothing runs.
#
# Each release publishes only:
#   Lore-Forge-Setup-x64.exe, Lore-Forge-amd64.deb, Lore-Forge-x86_64.AppImage, Lore-Forge-mac-arm64.dmg, Lore-Forge-mac-x64.dmg
#   plus latest.yml / latest-linux.yml / latest-mac.yml (self-updater; pointed at those stable names).
# Stable links: https://github.com/kaharamamm/Lore-Forge/releases/latest/download/<name>
# The builds are not code-signed (no paid certificates), so Windows and macOS ask once before the first start.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the newest vX.Y.Z tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead of the bump (optional, for example 1.1.0)
        type: string
        required: false
        default: ''
      notes:
        description: Release notes (shown above the generated list of changes)
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: git tag -l | node scripts/release-version.mjs "$BUMP" "$EXACT" | tee -a "$GITHUB_OUTPUT"
      - name: Tag exists
        if: steps.resolve.outputs.skip == 'true'
        run: echo "::notice::${{ steps.resolve.outputs.tag }} already exists, nothing to release."

  test:
    name: Test
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win nsis --x64
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage deb --x64
          - name: macOS
            os: macos-latest
            target: --mac dmg zip --arm64 --x64
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      # No signing certificate: never look for one in the runner's keychain (macOS is signed ad hoc instead).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        working-directory: packages/desktop
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.deb
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Keep only the public downloads
        working-directory: assets
        run: |
          set -euo pipefail
          cp "Lore-Forge-$V-win-x64.exe" Lore-Forge-Setup-x64.exe
          cp "Lore-Forge-$V-linux-amd64.deb" Lore-Forge-amd64.deb
          cp "Lore-Forge-$V-linux-x86_64.AppImage" Lore-Forge-x86_64.AppImage
          cp "Lore-Forge-$V-mac-arm64.dmg" Lore-Forge-mac-arm64.dmg
          cp "Lore-Forge-$V-mac-x64.dmg" Lore-Forge-mac-x64.dmg
          # Point electron-updater at the stable names, then drop everything else.
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          function meta(file) {
            const buf = fs.readFileSync(file);
            return {
              url: path.basename(file),
              sha512: crypto.createHash('sha512').update(buf).digest('base64'),
              size: buf.length,
            };
          }
          function writeYml(out, primary, extras = []) {
            const files = [primary, ...extras];
            const lines = [`version: ${process.env.V}`, 'files:'];
            for (const f of files) {
              lines.push(`  - url: ${f.url}`);
              lines.push(`    sha512: ${f.sha512}`);
              lines.push(`    size: ${f.size}`);
            }
            lines.push(`path: ${primary.url}`);
            lines.push(`sha512: ${primary.sha512}`);
            lines.push(`releaseDate: '${new Date().toISOString()}'`);
            fs.writeFileSync(out, lines.join('\n') + '\n');
          }
          const win = meta('Lore-Forge-Setup-x64.exe');
          const linux = meta('Lore-Forge-x86_64.AppImage');
          const macX64 = meta('Lore-Forge-mac-x64.dmg');
          const macArm = meta('Lore-Forge-mac-arm64.dmg');
          writeYml('latest.yml', win);
          writeYml('latest-linux.yml', linux);
          writeYml('latest-mac.yml', macX64, [macArm]);
          NODE
          # Public assets only (plus GitHub's auto source archives).
          find . -type f ! -name 'Lore-Forge-Setup-x64.exe' \
            ! -name 'Lore-Forge-amd64.deb' \
            ! -name 'Lore-Forge-x86_64.AppImage' \
            ! -name 'Lore-Forge-mac-arm64.dmg' \
            ! -name 'Lore-Forge-mac-x64.dmg' \
            ! -name 'latest.yml' \
            ! -name 'latest-linux.yml' \
            ! -name 'latest-mac.yml' \
            -delete
          ls -l
      - name: Create the release
        run: |
          gh release create "$TAG" \
            assets/Lore-Forge-Setup-x64.exe \
            assets/Lore-Forge-amd64.deb \
            assets/Lore-Forge-x86_64.AppImage \
            assets/Lore-Forge-mac-arm64.dmg \
            assets/Lore-Forge-mac-x64.dmg \
            assets/latest.yml \
            assets/latest-linux.yml \
            assets/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lore-Forge $V" \
            --notes "$NOTES" \
            --generate-notes \
            --latest
